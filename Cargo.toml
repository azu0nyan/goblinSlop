[package]
name = "goblin_slop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }
pulldown-cmark = "0.11"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "template_benchmarks"
harness = false
